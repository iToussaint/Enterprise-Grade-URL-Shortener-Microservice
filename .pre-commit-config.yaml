repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # Local hooks run the tool versions pinned in poetry.lock,
  # so pre-commit, the terminal and CI all use the same versions.
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]

      - id: ruff
        name: ruff
        entry: poetry run ruff check --fix
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy .
        language: system
        types: [python]
        pass_filenames: false

      # Regenerates requirements.txt from poetry.lock whenever dependencies change.
      - id: poetry-export
        name: export requirements.txt
        entry: poetry export -f requirements.txt --without-hashes -o requirements.txt
        language: system
        files: ^(pyproject\.toml|poetry\.lock)$
        pass_filenames: false
