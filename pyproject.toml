[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener microservice built with Flask, Flask-RESTX and Redis"
authors = [{ name = "Toussaint Iradukunda", email = "toussaint.iradukunda@amalitech.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-restx (>=1.3.2,<2.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "flask-injector (>=0.15.0,<0.16.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
# Alembic's generated migration environment and scripts are not type-annotated.
exclude = ["^migrations/"]

# These libraries ship without type information.
[[tool.mypy.overrides]]
module = ["decouple", "flask_injector", "flask_migrate", "flask_restx.*", "jsonschema"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.4,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
    "testcontainers[postgres] (>=4.15.0,<5.0.0)"
]
